  - Events
  - Experimentation
  - Logging
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.hypertune.com/analytics/guide
  baseURL: https://edge.hypertune.com
  properties:
  - url: https://docs.hypertune.com/analytics/guide
    type: Documentation
  - url: https://docs.hypertune.com/analytics/overview
    type: APIReference
  - url: openapi/hypertune-openapi.yml
    type: OpenAPI
  description: Real-time analytics and event logging. SDKs collect flag evaluations,
    experiment exposures, and analytics events (logged via event-trigger flags that
    evaluate a "Log event" expression) and flush them to Hypertune Edge in the background;
    flushLogs can be awaited in serverless environments to guarantee delivery.
