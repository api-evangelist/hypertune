  tags:
  - Feature Flags
  - GraphQL
  - SDK
  - Configuration
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.hypertune.com/concepts/graphql-api
  baseURL: https://edge.hypertune.com/graphql
  properties:
  - url: https://docs.hypertune.com/concepts/graphql-api
    type: Documentation
  - url: https://docs.hypertune.com/getting-started/graphql-quickstart
    type: APIReference
  - url: openapi/hypertune-openapi.yml
    type: OpenAPI
  - url: graphql/hypertune-graphql.md
    type: GraphQL
  - url: collections/hypertune.postman_collection.json
    type: PostmanCollection
  description: Evaluate feature flags, experiments, and app configuration. Flag logic
    is defined in Hyperlang and exposed as a GraphQL schema; queries to Hypertune Edge
    must supply all field arguments (the targeting context) so logic is fully reduced
    to a JSON result. Typically used through the type-safe TypeScript SDK and CLI-generated
    client, with a token-authenticated GraphQL Edge endpoint available for no-SDK access.
- aid: hypertune:hypertune-edge-config-delivery-api
  name: Hypertune Edge Config Delivery API
  tags:
  - Edge
  - CDN
  - Configuration
  - Initialization
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.hypertune.com/concepts/architecture
  baseURL: https://edge.hypertune.com
  properties:
  - url: https://docs.hypertune.com/concepts/architecture
    type: Documentation
  - url: https://docs.hypertune.com/sdk-reference/initialization
    type: APIReference
  - url: openapi/hypertune-openapi.yml
    type: OpenAPI
  description: Edge-delivered flag logic. SDKs make a single network request at initialization
    to fetch the project's flag logic from Hypertune Edge, served from Cloudflare CDN
    so there is no direct dependency on application servers, then evaluate flags locally
    and synchronously in memory and listen for logic updates in the background.
- aid: hypertune:hypertune-analytics-events-api
  name: Hypertune Analytics / Events API
  tags:
