aid: hypertune
url: https://raw.githubusercontent.com/api-evangelist/hypertune/refs/heads/main/apis.yml
name: Hypertune
kind: company
description: Hypertune is a type-safe, Git-based platform for feature flags, A/B testing,
  experimentation, analytics, and app configuration. Flag logic is authored in Hyperlang
  and modeled as a GraphQL schema; SDKs use a CLI to generate fully typed clients,
  fetch flag logic once from Hypertune Edge (Cloudflare CDN) at initialization, then
  evaluate flags locally and synchronously in memory. A GraphQL Edge API offers a
  no-SDK path, and analytics events are flushed back to Hypertune Edge in the background.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Feature Flags
- Experimentation
- A/B Testing
- Analytics
- App Configuration
- GraphQL
- Edge
created: '2026-06-20'
modified: '2026-06-20'
specificationVersion: '0.19'
apis:
