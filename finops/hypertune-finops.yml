meters:
- name: team_members
  description: Subscribed seats billed per team member per month ($10 Starter / $20 Pro).
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - plan
- name: cdn_requests
  description: SDK initialization and GraphQL Edge requests; 2M/month included on paid tiers, then $10 per 1M.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - project
- name: analytics_events
  description: Analytics events and exposures flushed to Hypertune Edge; 2M/month included on paid tiers, then $30 per 1M.
  unit: events
  aggregation: sum
  dimensions:
  - account
  - project
- name: enterprise_volume
  description: Enterprise volume-based and MTU (monthly tracked user) billing negotiated per contract.
  unit: units
  aggregation: sum
  dimensions:
  - account
  - contract
principles:
- name: Visibility
  description: Track seat count plus monthly CDN-request and analytics-event consumption against plan allowances.
- name: Allocation
  description: Map projects and environments to teams; attribute CDN-request and event meters per project.
- name: Optimization
  description: Lean on local in-memory evaluation and SDK bootstrapping to limit initialization requests; batch and flush events efficiently to stay under allowances.
- name: Accountability
  description: Review seat assignments and overage on CDN requests and analytics events monthly against budget.
