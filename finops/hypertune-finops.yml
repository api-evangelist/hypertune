description: >-
  FinOps view of Hypertune spend. Hypertune bills a per-team-member subscription
  (Free / Starter at $10 / Pro at $20 per seat per month) plus usage-based
  overage on two meters: CDN requests (SDK initialization and GraphQL Edge
  evaluation) at $10 per additional 1M beyond the 2M monthly allowance, and
  analytics events at $30 per additional 1M beyond the 2M monthly allowance.
  Enterprise uses flexible volume-based and MTU pricing. Because SDKs fetch flag
  logic once and evaluate locally in memory, CDN-request spend is driven mainly
  by initialization frequency rather than per-flag-evaluation calls.
notes: >-
  Per-seat and overage rates reflect the published hypertune.com/pricing page as
  of 2026-06-20; verify on reconciliation. NOTE: Hypertune is shutting down and
  will cease operations on August 10, 2026.
